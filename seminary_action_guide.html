function applyStyle(text, styles, userAddress) {
  if (!styles || styles.length === 0) return text;
  let t = text;
  const has = s => styles.includes(s);

  // BRIEF is handled in generateLetter (limits topics and uses short variants)
  // But also do a pass to trim any remaining long paragraphs
  if (has("brief")) {
    t = t.split("\n\n").map(para => {
      const sentences = para.match(/[^.!?]+[.!?]+/g);
      if (sentences && sentences.length > 2) return sentences.slice(0, 2).join("").trim();
      return para;
    }).join("\n\n");
  }

  // DETAILED: add elaborating phrases
  if (has("detailed")) {
    const adds = [" I want to be specific about this.", " The details matter here.", " To elaborate further:", " Let me explain why this matters."];
    const paras = t.split("\n\n");
    if (paras.length > 3) {
      const idx = 2 + Math.floor(Math.random() * (paras.length - 3));
      paras[idx] = paras[idx] + adds[Math.floor(Math.random() * adds.length)];
    }
    t = paras.join("\n\n");
  }

  // BLUNT: shorten sentences, remove hedging
  if (has("blunt")) {

    name: "",

    family: false,
    longtime: false
  });
  const [genStyle, setGenStyle] = useState([]);
  const [tmplConcern, setTmplConcern] = useState("");
  const genLetterRef = useRef(null);
  const letterRef = useRef(null);
  const refs = useRef({});
  const navRef = useRef(null);
  const navBtnRefs = useRef({});
  const isManualScroll = useRef(false);

  // Scroll-track: on scroll, find which section is currently at the top of viewport
  useEffect(() => {
    let ticking = false;
    const onScroll = () => {
      if (ticking || isManualScroll.current) return;
      ticking = true;
      requestAnimationFrame(() => {
        const offset = 120; // account for sticky header height
        let current = SECTIONS[0].id;
        for (let i = SECTIONS.length - 1; i >= 0; i--) {
          const el = refs.current[SECTIONS[i].id];
          if (el) {
            const top = el.getBoundingClientRect().top;
            if (top <= offset) {
              current = SECTIONS[i].id;
              break;
            }
          }
        }
        setActive(prev => prev !== current ? current : prev);
        ticking = false;
      });
    };
    window.addEventListener("scroll", onScroll, {
      passive: true
    });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  // Auto-center active tab in the horizontal nav
  useEffect(() => {
    const btn = navBtnRefs.current[active];
    const nav = navRef.current;
    if (btn && nav) {
      const navRect = nav.getBoundingClientRect();
      const btnRect = btn.getBoundingClientRect();
      const offset = btnRect.left - navRect.left - navRect.width / 2 + btnRect.width / 2;
      nav.scrollBy({
        left: offset,
        behavior: "smooth"
      });
    }
  }, [active]);
  const scrollTo = useCallback(id => {
    const el = refs.current[id];
    if (el) {
      isManualScroll.current = true;
      setActive(id);
      el.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
      setTimeout(() => {
        isManualScroll.current = false;
      }, 1000);
    }

    letterText = letterText.replace(/\[INSERT YOUR SPECIFIC CONCERN[^\]]*\]/, tmplConcern.trim());
  }
